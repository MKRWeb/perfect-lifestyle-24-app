name: Build Android APK & Publish Release

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Prepare Web Assets & Sync Capacitor Android
        run: |
          rm -rf www android package-lock.json
          mkdir -p www
          cp index.html style.css app.js manifest.json sw.js icon.svg www/
          printf '{\n  "appId": "com.mostafakamalraju.perfectlifestyle24",\n  "appName": "Perfect Lifestyle 24",\n  "webDir": "www"\n}\n' > capacitor.config.json
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap add android
          npx cap sync android

      - name: Compile Standalone Android APK
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../Perfect_Lifestyle_24.apk

      - name: Upload APK to Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Perfect_Lifestyle_24_APK
          path: Perfect_Lifestyle_24.apk

      - name: Publish Direct Downloadable APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "Perfect Lifestyle 24 — Android App (APK)"
          body: "Official Standalone Offline Android APK for Prevention is the Best Cure Monograph."
          files: Perfect_Lifestyle_24.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
