name: Build Android APK & Publish Release

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up JDK 21 for Capacitor 6
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Initialize Capacitor & Bundle Web Assets
        run: |
          mkdir -p www
          cp index.html style.css app.js manifest.json sw.js icon.svg www/
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "Perfect Lifestyle 24" "com.mostafakamalraju.perfectlifestyle24" --web-dir www || true
          npx cap add android || true
          npx cap copy android

      - name: Compile Standalone Debug APK
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../Perfect_Lifestyle_24_v1.0.apk

      - name: Upload Compiled APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Perfect_Lifestyle_24_v1.0_APK
          path: Perfect_Lifestyle_24_v1.0.apk
          
